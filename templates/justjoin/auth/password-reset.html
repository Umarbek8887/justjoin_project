{% extends 'justjoin/auth/auth-base.html' %}
{% load static %}

{% block title %}
    Password Reset
{% endblock %}

{% block main_content %}
    <div class="form-header">
        <a href="{% url 'login_by_email_page' %}" class="back-arrow" title="Back">←</a>
        <h1 class="form-title">Password assistance</h1>
    </div>
    <div class="card">
        <p class="card-subtitle">
            Enter the email address associated with<br/>your justjoin.it account.
        </p>

        <div class="field">
            <label for="resetEmail">Email address <span class="required">*</span></label>
            <input type="email" id="resetEmail" placeholder="name@domain.com" autocomplete="email"/>
            <span class="field-error" id="resetEmailError"></span>
        </div>

        <button class="btn-email" id="resetBtn" type="button">Reset password</button>
    </div>
{% endblock %}
